<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- OneUp's system service (docs/specs/ONEUP-0249-system-service.md §4.8). Root may own
     the name. Anyone may call its interface: the service asks polkit before it runs
     anything, with Discover's own system-update permission (§4.4). -->
<busconfig>
  <policy user="root">
    <allow own="za.co.antsprojectshub.OneUp1"/>
  </policy>
  <policy context="default">
    <allow send_destination="za.co.antsprojectshub.OneUp1"
           send_interface="za.co.antsprojectshub.OneUp1"/>
    <allow send_destination="za.co.antsprojectshub.OneUp1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="za.co.antsprojectshub.OneUp1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
