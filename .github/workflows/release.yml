name: Release

# Build the single-file AppImage and attach it to the GitHub release whenever a
# version tag (v1.0.0, v1.1.0, …) is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04   # build on an older glibc so the AppImage runs widely
    # A good run takes about 5 minutes. A stalled one otherwise sits until GitHub's 6-hour
    # default: apt at v1.4.5, the engine tests at v1.4.6. This makes it a red run a
    # re-run clears (ONEUP-0116).
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit SHA, not a major tag: a tag is mutable and
      # its publisher can move it to any commit. The trailing comment is the version
      # the sweep in docs/standards/dependencies.md compares against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, so the job token has no reason to stay in
          # .git/config where every later step (and the AppImage build) can read it.
          persist-credentials: false

      # The release page shows the tag's dated CHANGELOG section, not GitHub's
      # generated notes, which are one compare link (ONEUP-0271). First, so a tag
      # with no section fails before the build rather than shipping blank notes.
      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v head="## [$ver] - " '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/       { exit }
            on && /^\[[^]]+\]: / { exit }
            on                   { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || {
            echo "::error::CHANGELOG.md has no '## [$ver] - <date>' section with entries"
            exit 1
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          # No `cache: pip`, deliberately: this job publishes the release, and a
          # restored cache is input another run could have written (zizmor:
          # cache-poisoning). The pinned set carries no hashes to catch that.

      # Same gate local-CI.sh runs first, so a broken engine never ships in a release.
      - name: Run engine tests
        run: bash tests/run-tests.sh

      # Stdlib-only table over oneup/engine/parsers.py — to_bytes, the two
      # download-size wordings, the progress wordings, `zypper lr -u` output and
      # the lock file's text (mirrors local-CI.sh).
      - name: Engine parser unit tests
        run: python tests/parsers-test.py

      # Stdlib-only; asserts bump.py advances every version site (mirrors local-CI.sh).
      - name: bump.py functional test
        run: python tests/bump-test.py

      # Stdlib-only structural gate on the oneup/ package (mirrors local-CI.sh).
      # Named here as well because nothing in this project discovers tests: both
      # files list every suite by hand, so a suite added to one only runs there.
      - name: Package structure
        run: python tests/imports-test.py

      # Translation groundwork source checks (ONEUP-0032). Mirrors local-CI.sh.
      - name: Translation groundwork
        run: python tests/i18n-check.py

      # Headless GUI smoke test (offscreen Qt). Mirrors local-CI.sh. A real
      # assertion failure blocks the release; exit 77 (PySide6/Qt unavailable) is
      # treated as a skip so an environment quirk can't hold up a tag. It installs
      # the AppImage's pinned set, so the release is tested on the toolkit it ships.
      - name: GUI smoke test (offscreen)
        run: |
          sudo apt-get update
          # libfuse2 is for the AppImage pack step below; installed here so the
          # job refreshes the package index once rather than twice.
          # dbus is for the system service suite's private bus, below.
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfuse2 dbus
          python -m pip install --quiet -r packaging/appimage/requirements.txt
          python tests/gui-smoke.py || {
            rc=$?
            [ "$rc" -eq 77 ] && echo "PySide6 unavailable — skipped"
            [ "$rc" -eq 77 ] || exit "$rc"
          }

      # The same suite mirrored right-to-left (ONEUP-0032 INV-5). Mirrors local-CI.sh.
      - name: GUI smoke test (offscreen, right-to-left)
        run: |
          python tests/gui-smoke.py -reverse || {
            rc=$?
            [ "$rc" -eq 77 ] && echo "PySide6 unavailable — skipped"
            [ "$rc" -eq 77 ] || exit "$rc"
          }

      # The system service against a private dbus-daemon (ONEUP-0249). Mirrors local-CI.sh.
      # jeepney at the version docs/standards/dependencies.md records; exit 77 (dbus-daemon
      # or jeepney unavailable) is a skip, as for the GUI suite.
      - name: System service suite
        run: |
          python -m pip install --quiet jeepney==0.9.0
          python tests/service-test.py || {
            rc=$?
            [ "$rc" -eq 77 ] && echo "dbus-daemon or jeepney unavailable — skipped"
            [ "$rc" -eq 77 ] || exit "$rc"
          }

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Attach AppImage to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: OneUp-x86_64.AppImage
          body_path: release-notes.md
